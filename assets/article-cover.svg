<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chromeGradient" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop stop-color="#ECECEC"/>
      <stop offset="0.5" stop-color="#CFA0FF"/>
      <stop offset="1" stop-color="#74C6FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#191919"/>
  <!-- Icon group, shifted further left to help center the entire block -->
  <g transform="translate(55, 115)">
    <rect x="2" y="2" width="396" height="396" rx="48" fill="#191919" stroke="#CFA0FF" stroke-width="4"/>
    <text x="200" y="200" dominant-baseline="middle" text-anchor="middle" fill="url(#chromeGradient)" font-size="220" font-family="sans-serif" font-weight="bold">
      VC
    </text>
  </g>
  <!-- Text group, shifted further left, with slightly smaller fonts -->
  <g transform="translate(515, 265)">
    <text fill="#ECECEC" font-family="sans-serif" font-size="50" font-weight="bold">
      <tspan x="0" y="0">From Personal Hack to</tspan>
      <tspan x="0" y="65">Published Product</tspan>
    </text>
    <text fill="#CFA0FF" font-family="sans-serif" font-size="26" font-weight="normal" y="125">
      My Journey Designing a VS Code Theme
    </text>
  </g>
</svg>
